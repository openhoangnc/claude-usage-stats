name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Release Version & Auto-Versioning
        id: versioning
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          git fetch --tags || true

          if [ "$IS_TAG" = "true" ]; then
            TAG_NAME="$REF_NAME"
            VERSION="${TAG_NAME#v}"
          else
            # Latest existing tag, or v1.0.0 if none.
            LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "v1.0.0")
            echo "Latest tag found: ${LATEST_TAG}"

            CLEAN_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            BUMP_TYPE="${BUMP_TYPE:-patch}"
            case "$BUMP_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG_NAME="v${VERSION}"
          fi

          echo "Target Release Version: ${VERSION}"
          echo "Target Tag: ${TAG_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Update Info.plist Version
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          echo "Updating Info.plist to version ${VERSION}..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" Info.plist

      - name: Build macOS Application
        run: |
          chmod +x make_icon.sh build.sh
          ./make_icon.sh
          ./build.sh

      - name: Package Application Zip
        run: |
          zip -r -y ClaudeUsageStats.zip ClaudeUsageStats.app

      - name: Tag Repository
        env:
          TAG_NAME: ${{ steps.versioning.outputs.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Creating git tag ${TAG_NAME}..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG_NAME}"
            git push origin "${TAG_NAME}" || echo "Tag push skipped or already exists."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Claude Usage Stats ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ClaudeUsageStats.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
